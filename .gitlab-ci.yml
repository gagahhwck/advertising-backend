stages:
  - deploy

deploy-job:
  stage: deploy
  script:
    - cd /home/gagah/public_html/advertising-be
    - git stash
    - git pull
    - docker compose up -d
    - docker compose exec app bash -c 'composer update'
    - docker compose exec app bash -c 'php artisan migrate'
    - docker compose restart
    - docker restart advertising
    - docker restart api-service-uiii
  tags:
    - runner-api-dev
